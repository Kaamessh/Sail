name: Daily ML Model Retraining & Storage Sync

on:
  schedule:
    - cron: '0 23 * * *'  # Run daily at 23:00 UTC
  workflow_dispatch:        # Allow manual execution via GitHub UI

jobs:
  retrain-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Model Retraining & Cloud Storage Upload
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python ml_pipeline/train_and_upload.py

      - name: Commit & Push Updated Local Artifacts
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add models/artifacts backend/artifacts api/artifacts
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(ml): automated daily model artifact weights retraining [skip ci]" && git pull --rebase origin main && git push origin main)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
